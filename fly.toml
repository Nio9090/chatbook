# fly.toml app configuration file generated for chatbook-ltu2-q on 2026-09-29T13:45:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatbook-ltu2-q'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[processes]
  app = 'node server.js'

[[mounts]]
  source = 'chatbook_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
